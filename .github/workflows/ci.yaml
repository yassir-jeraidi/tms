name: Sync Tolgee Translations

# This listens for the webhook from Tolgee (or can be run manually)
on:
  repository_dispatch:
    types: [tolgee-update]
  workflow_dispatch:

jobs:
  pull-and-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Tolgee CLI
        run: npm install -g @tolgee/cli

      - name: Pull Translations
        # Automatically pulls the en.json, fr.json files to your Paraglide folder
        run: tolgee pull --format json --path ./apps/website/messages
        env:
          TOLGEE_API_URL: ${{ secrets.TOLGEE_API_URL }} # E.g., https://app.tolgee.io or your self-hosted URL
          TOLGEE_API_KEY: ${{ secrets.TOLGEE_API_KEY }}
          TOLGEE_PROJECT_ID: ${{ secrets.TOLGEE_PROJECT_ID }}

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: i18n/tolgee-updates
          commit-message: "chore(i18n): pull latest translations from Tolgee"
          title: "🌐 Localization: Text Updates from Figma/Tolgee"
          body: |
            ## New Translations Available
            This PR was automatically generated by Tolgee.
            When merged, Paraglide will instantly compile these new keys.