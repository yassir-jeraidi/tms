name: i18n

on:
  pull_request:
    paths:
      - 'web/messages/**'
      - 'web/project.inlang/**'
      - 'crowdin.yml'
  push:
    branches: [main, master]
    paths:
      - 'web/messages/**'
      - 'web/project.inlang/**'
  workflow_dispatch:

jobs:
  paraglide-compile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Compile Paraglide messages
        run: npm run i18n:compile
